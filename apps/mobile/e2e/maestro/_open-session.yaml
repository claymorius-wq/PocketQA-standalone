# Shared: sign in as the seeded tester and open a session on the seeded study.
appId: com.reshareai.pocketqa
---
- launchApp:
    clearState: true
    # Maestro grants every runtime permission by default; NOTIFICATIONS lets a flow deny it.
    permissions:
      notifications: ${NOTIFICATIONS || 'allow'}
      # Narration needs the microphone; MIC=deny exercises the refusal path.
      microphone: ${MIC || 'allow'}
# A fresh install shows the intro once before Sign in (main #10).
- runFlow: _skip-intro.yaml
# A cold start on a loaded host can take longer than Maestro's default wait.
- extendedWaitUntil:
    visible:
      id: sign-in-email
    timeout: 60000
- tapOn:
    id: sign-in-email
- inputText: ${EMAIL}
- tapOn:
    id: sign-in-password
- inputText: ${PASSWORD}
- hideKeyboard
- tapOn:
    id: sign-in-submit
- tapOn: ${STUDY}
- scrollUntilVisible:
    element:
      id: consent-checkbox
- tapOn:
    id: consent-checkbox
- tapOn:
    id: consent-submit
- tapOn:
    id: session-start
- scrollUntilVisible:
    element:
      id: record-start
