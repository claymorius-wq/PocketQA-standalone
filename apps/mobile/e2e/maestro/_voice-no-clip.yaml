# After process death: the session reopens with no clip offered (the truncated file is swept).
appId: com.reshareai.pocketqa
---
- launchApp:
    appId: com.reshareai.pocketqa
    stopApp: false
- scrollUntilVisible:
    element:
      id: record-start
    timeout: 20000
- assertNotVisible:
    id: segment-recorded
