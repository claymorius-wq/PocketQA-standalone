appId: com.reshareai.pocketqa
---
- launchApp:
    clearState: true
- tapOn:
    id: sign-in-email
- inputText: ${EMAIL}
- tapOn:
    id: sign-in-password
- inputText: ${PASSWORD}
- hideKeyboard
- tapOn:
    id: sign-in-submit
- tapOn:
    id: tab-settings
- scrollUntilVisible:
    element:
      id: wallet-link
- tapOn:
    id: wallet-link
