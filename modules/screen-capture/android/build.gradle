plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.pocketqascreencapture'
version = '0.1.0'

android {
  namespace "expo.modules.pocketqascreencapture"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
}

dependencies {
  // JVM unit tests for the pure parts (PendingStore, CaptureMath): ./gradlew :<module>:testDebugUnitTest
  testImplementation 'junit:junit:4.13.2'
}
